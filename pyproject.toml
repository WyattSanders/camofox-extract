[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camofox-extract"
version = "0.1.0"
description = "Extract clean markdown from any URL using the Camofox anti-detection browser"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["camofox", "web-scraping", "anti-detection", "extraction", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
camofox-extract = "camofox_extract.cli:main"

[project.urls]
Homepage = "https://github.com/nousresearch/camofox-extract"
Repository = "https://github.com/nousresearch/camofox-extract"

[tool.setuptools.packages.find]
include = ["camofox_extract*"]
